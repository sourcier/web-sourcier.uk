[dev]
  framework = "astro"
  command = "astro dev"
  targetPort = 4321
  autoLaunch = false

# Draft preview: push to the `preview` branch to get a Netlify deploy that
# includes draft posts. Share the resulting URL (e.g. preview--sourcier.netlify.app)
# before a post goes live. Never merged into main.
[context."branch-deploy"]
  [context."branch-deploy".environment]
    SHOW_DRAFTS = "true"

[build]
  command = "pnpm build:netlify"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Rebuild the site daily at 07:00 UTC so future-dated posts go live automatically.
# Requires BUILD_HOOK_ID environment variable — see netlify/functions/scheduled-build.mjs.
[functions."scheduled-build"]
  schedule = "45 7 * * *" # always before 09:00 UK time: 07:45 GMT in winter, 08:45 BST in summer

# ── Security headers ───────────────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    # sha256 hash covers the synchronous inline theme-detection script in BaseLayout.astro.
    # Recalculate with: node /tmp/compute-csp-hash.mjs  (or equivalent) if that script changes.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'sha256-APuAAsOc0BsU74ZsTZ66BgzFLHlcw+KZq3xKuNsnvIg=' https://eu.i.posthog.com https://eu-assets.i.posthog.com https://js.stripe.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://eu.i.posthog.com https://eu-assets.i.posthog.com https://api.stripe.com https://r.stripe.com; frame-src https://js.stripe.com https://hooks.stripe.com https://m.stripe.network; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self';"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# ── Comment approval system ────────────────────────────────────────────────────
#
# Required environment variables (Netlify → Site configuration → Environment variables):
#
#   GITHUB_PAT                GitHub personal access token (fine-grained) with
#                             read-only Contents access to sourcier/web-sourcier.uk-content.
#                             Used to fetch the private blog content submodule at build time.
#                             https://github.com/settings/tokens?type=beta
#
#   BUILD_HOOK_ID             Build hook ID for scheduled deploys.
#                             Netlify → Site configuration → Build & deploy → Build hooks
#                             Create a hook named "Scheduled publish", copy the ID from the URL.
#
#   NETLIFY_ACCESS_TOKEN      Personal access token
#                             https://app.netlify.com/user/applications
#
#   APPROVED_COMMENTS_FORM_ID Form ID for the "approved-comments" form.
#                             Visible in the Netlify Forms dashboard URL after
#                             the first comment is approved.
#
#   APPROVAL_SECRET           Random secret for HMAC-signing approve/delete links.
#                             Generate with: openssl rand -hex 32
#
#   SITE_URL                  Public URL of the site, e.g. https://sourcier.uk
#
#   PREVIEW_PASSCODE          Passcode that gates access to the `preview` branch deploy.
#                             Set this in the Netlify dashboard scoped to branch deploys only:
#                             Site configuration → Environment variables → Add variable
#                             → Scope: Branch deploys. Changing the value invalidates all
#                             existing sessions. Generate with: openssl rand -base64 12
#
#   RESEND_API_KEY            API key from https://resend.com
#                             (free tier: 3 000 emails/month)
#
#   NOTIFY_FROM_EMAIL         Verified Resend sender address, e.g. comments@sourcier.uk
#
#   NOTIFY_EMAIL              Address to receive comment notifications
#
# One-time Netlify dashboard setup:
#   Forms → blog-comments → Form notifications → Add notification
#   → Outgoing webhook → URL: https://{your-site}/.netlify/functions/comment-handler
# ──────────────────────────────────────────────────────────────────────────────
