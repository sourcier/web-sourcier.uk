name: Lighthouse
run-name: "[lighthouse] on-demand"

on:
  workflow_dispatch:

jobs:
  lighthouse:
    name: Lighthouse (${{ matrix.form_factor }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - form_factor: mobile
          - form_factor: desktop
            configPath: .github/lighthouse/desktop.json
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/lighthouse
        with:
          form_factor: ${{ matrix.form_factor }}
          configPath: ${{ matrix.configPath }}
