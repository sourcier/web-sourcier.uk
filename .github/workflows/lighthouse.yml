name: Lighthouse
run-name: "[lighthouse] on-demand (${{ inputs.environment }})"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to audit
        type: choice
        options: [prod, preview]
        default: prod

jobs:
  lighthouse:
    name: Lighthouse (${{ matrix.form_factor }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - form_factor: mobile
          - form_factor: desktop
            configPath: .github/lighthouse/desktop.json
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/lighthouse
        with:
          form_factor: ${{ matrix.form_factor }}
          configPath: ${{ matrix.configPath }}
          base_url: ${{ inputs.environment == 'preview' && 'https://preview--sourcieruk.netlify.app' || 'https://sourcier.uk' }}
          preview_passcode: ${{ inputs.environment == 'preview' && secrets.PREVIEW_PASSCODE || '' }}
