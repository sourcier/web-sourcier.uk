name: CI
run-name: >-
  ${{ github.event_name == 'schedule' && '[scheduled] publish' ||
      github.event_name == 'repository_dispatch' && format('[content] {0}', github.event.client_payload.commit_message) ||
      github.event_name == 'pull_request' && format('[pr] {0}', github.event.pull_request.title) ||
      github.event_name == 'workflow_dispatch' && format('[manual] {0} by @{1}', github.ref_name, github.actor) ||
      github.event.head_commit.message }}

on:
  push:
    branches: [preview, main]
  pull_request:
    branches: [preview, main]
  repository_dispatch:
    types: [content-updated]
  schedule:
    - cron: "45 7 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, Lint & Test
    if: ${{ !contains(github.event.head_commit.message, '#skip-ci') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup

      - run: pnpm format:check

      - run: pnpm lint

      - run: pnpm typecheck:functions

      - run: pnpm test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [quality]
    if: ${{ !contains(github.event.head_commit.message, '#skip-ci') }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup

      - name: Fetch content
        run: pnpm build:content:fetch
        env:
          GITHUB_PAT: ${{ secrets.GH_PAT }}

      - run: pnpm assets:sync

      - run: pnpm build
        env:
          SHOW_DRAFTS: ${{ github.ref == 'refs/heads/preview' && 'true' || 'false' }}
          PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          PUBLIC_POSTHOG_KEY: ${{ secrets.PUBLIC_POSTHOG_KEY }}
          PUBLIC_POSTHOG_HOST: ${{ secrets.PUBLIC_POSTHOG_HOST }}

      - run: pnpm build:search

      - name: Bundle Netlify functions
        run: pnpm build:functions

      - name: Upload built site
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 1

      - name: Upload bundled functions
        uses: actions/upload-artifact@v7
        with:
          name: functions
          path: .netlify/functions-built
          retention-days: 1

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [build, visual-regression]
    if: |
      always() &&
      needs.build.result == 'success' &&
      (needs['visual-regression'].result == 'success' || needs['visual-regression'].result == 'skipped') &&
      github.event_name != 'pull_request'
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup

      - name: Download built site
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Download bundled functions
        uses: actions/download-artifact@v8
        with:
          name: functions
          path: .netlify/functions-built

      - name: Resolve deploy message
        env:
          RAW_MSG: >-
            ${{ github.event_name == 'schedule' && '[scheduled] publish' ||
                github.event_name == 'repository_dispatch' && github.event.client_payload.commit_message ||
                github.event_name == 'pull_request' && github.event.pull_request.title ||
                github.event.head_commit.message }}
        run: echo "DEPLOY_MSG=$(echo "$RAW_MSG" | head -1)" >> "$GITHUB_ENV"

      - name: Deploy to Netlify (production)
        if: github.ref == 'refs/heads/main'
        run: |
          OUTPUT=$(pnpm netlify deploy --dir=dist --functions .netlify/functions-built --prod --no-build --message "$DEPLOY_MSG" --json)
          echo "DEPLOY_URL=$(echo "$OUTPUT" | jq -r '.deploy_url')" >> $GITHUB_ENV
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

      - name: Deploy to Netlify (preview)
        if: github.ref == 'refs/heads/preview'
        run: |
          OUTPUT=$(pnpm netlify deploy --dir=dist --functions .netlify/functions-built --no-build --message "$DEPLOY_MSG" --json)
          echo "DEPLOY_URL=$(echo "$OUTPUT" | jq -r '.deploy_url')" >> $GITHUB_ENV
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

      - name: Smoke test functions
        run: |
          BASE="$DEPLOY_URL/.netlify/functions"
          fail=0
          rows=""

          check() {
            local name="$1" url="$2" method="${3:-GET}"
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X "$method" "$url")
            if [ "$STATUS" = "502" ] || [ "$STATUS" = "000" ]; then
              echo "FAIL [$name] HTTP $STATUS — $url"
              rows="$rows| ❌ | \`$name\` | $STATUS |\n"
              fail=1
            else
              echo "OK   [$name] HTTP $STATUS"
              rows="$rows| ✅ | \`$name\` | $STATUS |\n"
            fi
          }

          check "reactions"                "$BASE/reactions?post=smoke-test"
          check "get-comments"             "$BASE/get-comments?slug=smoke-test"
          check "support-checkout-session" "$BASE/support-checkout-session" "OPTIONS"
          check "subscribe"                "$BASE/subscribe" "OPTIONS"

          {
            echo "## Function Smoke Tests"
            echo ""
            echo "| | Function | HTTP |"
            echo "| --- | --- | --- |"
            printf "$rows"
          } >> "$GITHUB_STEP_SUMMARY"

          exit $fail

  lighthouse:
    name: Lighthouse (${{ matrix.form_factor }})
    needs: deploy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - form_factor: mobile
          - form_factor: desktop
            configPath: .github/lighthouse/desktop.json
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/lighthouse
        with:
          form_factor: ${{ matrix.form_factor }}
          configPath: ${{ matrix.configPath }}

  visual-regression:
    name: Visual Regression
    runs-on: ubuntu-latest
    needs: build
    if: ${{ !contains(github.event.head_commit.message, '#skip-ci') && (github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') }}
    # Pin to the same Playwright Docker image used in visual-regression.yml so
    # font rendering is identical to the stored baselines.
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
      options: --ipc=host
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      # jq is not included in the Playwright Docker image
      - run: apt-get update && apt-get install -y jq
        shell: bash

      # Node.js is provided by the Playwright container; setup is only used for pnpm caching.
      - uses: ./.github/actions/setup

      - name: Download built site
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - uses: ./.github/actions/visual-regression
