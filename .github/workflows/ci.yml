name: CI
run-name: >-
  ${{ github.event_name == 'schedule' && '[scheduled] publish' ||
      github.event_name == 'repository_dispatch' && format('[content] {0}', github.event.client_payload.commit_message) ||
      github.event_name == 'pull_request' && format('[pr] {0}', github.event.pull_request.title) ||
      github.event.head_commit.message }}

on:
  push:
    branches: [preview, main]
  pull_request:
    branches: [preview, main]
  repository_dispatch:
    types: [content-updated]
  schedule:
    - cron: "45 7 * * *"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: lts/krypton
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check

      - run: pnpm lint

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: lts/krypton
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [quality, test]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: lts/krypton
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Fetch content
        run: pnpm build:content:fetch
        env:
          GITHUB_PAT: ${{ secrets.GH_PAT }}

      - run: pnpm assets:sync

      - run: pnpm build
        env:
          SHOW_DRAFTS: ${{ github.ref == 'refs/heads/preview' && 'true' || 'false' }}

      - run: pnpm build:search

      - name: Upload built site
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 1

      - name: Deploy to Netlify (production)
        if: github.ref == 'refs/heads/main'
        run: |
          pnpm --package=netlify-cli dlx netlify deploy --dir=dist --prod --no-build --message "\
          ${{ github.event_name == 'schedule' && '[scheduled] publish' ||
              github.event_name == 'repository_dispatch' && github.event.client_payload.commit_message ||
              github.event_name == 'pull_request' && github.event.pull_request.title ||
              github.event.head_commit.message }}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

      - name: Deploy to Netlify (preview)
        if: github.ref == 'refs/heads/preview'
        run: |
          pnpm --package=netlify-cli dlx netlify deploy --dir=dist --no-build --message "\
          ${{ github.event_name == 'schedule' && '[scheduled] publish' ||
              github.event_name == 'repository_dispatch' && github.event.client_payload.commit_message ||
              github.event_name == 'pull_request' && github.event.pull_request.title ||
              github.event.head_commit.message }}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

  lighthouse:
    name: Lighthouse (${{ matrix.form_factor }})
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - form_factor: mobile
          - form_factor: desktop
            configPath: .github/lighthouse/desktop.json
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/lighthouse
        with:
          form_factor: ${{ matrix.form_factor }}
          configPath: ${{ matrix.configPath }}

  visual:
    name: Visual Regression
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: lts/krypton
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Download built site
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - uses: ./.github/actions/visual-regression
