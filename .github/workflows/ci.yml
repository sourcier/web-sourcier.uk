name: CI
run-name: >-
  ${{ github.event_name == 'schedule' && '[scheduled] publish' ||
      github.event_name == 'repository_dispatch' && format('[content] {0}', github.event.client_payload.commit_message) ||
      github.event_name == 'pull_request' && format('[pr] {0}', github.event.pull_request.title) ||
      github.event.head_commit.message }}

on:
  push:
    branches: [preview, main]
  pull_request:
    branches: [preview, main]
  repository_dispatch:
    types: [content-updated]
  schedule:
    - cron: "45 7 * * *"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, Lint & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: lts/krypton
          cache: pnpm

      - name: Restore node_modules cache
        id: nm-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - run: pnpm install --frozen-lockfile
        if: steps.nm-cache.outputs.cache-hit != 'true'

      - run: pnpm format:check

      - run: pnpm lint

      - run: pnpm typecheck:functions

      - run: pnpm test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [quality]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: lts/krypton
          cache: pnpm

      - name: Restore node_modules cache
        id: nm-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - run: pnpm install --frozen-lockfile
        if: steps.nm-cache.outputs.cache-hit != 'true'

      - name: Fetch content
        run: pnpm build:content:fetch
        env:
          GITHUB_PAT: ${{ secrets.GH_PAT }}

      - run: pnpm assets:sync

      - run: pnpm build
        env:
          SHOW_DRAFTS: ${{ github.ref == 'refs/heads/preview' && 'true' || 'false' }}

      - run: pnpm build:search

      - name: Bundle Netlify functions
        run: pnpm build:functions

      - name: Upload built site
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 1

      - name: Upload bundled functions
        uses: actions/upload-artifact@v4
        with:
          name: functions
          path: .netlify/functions-built
          retention-days: 1

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [build, visual-regression]
    if: |
      always() &&
      needs.build.result == 'success' &&
      (needs['visual-regression'].result == 'success' || needs['visual-regression'].result == 'skipped') &&
      github.event_name != 'pull_request'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Download built site
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Download bundled functions
        uses: actions/download-artifact@v4
        with:
          name: functions
          path: .netlify/functions-built

      - name: Deploy to Netlify (production)
        if: github.ref == 'refs/heads/main'
        run: |
          msg=$(echo "$DEPLOY_MSG" | head -1)
          OUTPUT=$(pnpm --package=netlify-cli dlx netlify deploy --dir=dist --functions .netlify/functions-built --prod --no-build --message "$msg" --json)
          echo "DEPLOY_URL=$(echo "$OUTPUT" | jq -r '.deploy_url')" >> $GITHUB_ENV
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          DEPLOY_MSG:
            ${{ github.event_name == 'schedule' && '[scheduled] publish' ||
            github.event_name == 'repository_dispatch' && github.event.client_payload.commit_message ||
            github.event_name == 'pull_request' && github.event.pull_request.title ||
            github.event.head_commit.message }}

      - name: Deploy to Netlify (preview)
        if: github.ref == 'refs/heads/preview'
        run: |
          msg=$(echo "$DEPLOY_MSG" | head -1)
          OUTPUT=$(pnpm --package=netlify-cli dlx netlify deploy --dir=dist --functions .netlify/functions-built --no-build --message "$msg" --json)
          echo "DEPLOY_URL=$(echo "$OUTPUT" | jq -r '.deploy_url')" >> $GITHUB_ENV
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          DEPLOY_MSG:
            ${{ github.event_name == 'schedule' && '[scheduled] publish' ||
            github.event_name == 'repository_dispatch' && github.event.client_payload.commit_message ||
            github.event_name == 'pull_request' && github.event.pull_request.title ||
            github.event.head_commit.message }}

      - name: Smoke test functions
        run: |
          BASE="$DEPLOY_URL/.netlify/functions"
          fail=0

          check() {
            local name="$1" url="$2" method="${3:-GET}"
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X "$method" "$url")
            if [ "$STATUS" = "502" ] || [ "$STATUS" = "000" ]; then
              echo "FAIL [$name] HTTP $STATUS — $url"
              fail=1
            else
              echo "OK   [$name] HTTP $STATUS"
            fi
          }

          check "reactions"                "$BASE/reactions?post=smoke-test"
          check "get-comments"             "$BASE/get-comments?post=smoke-test"
          check "support-checkout-session" "$BASE/support-checkout-session" "OPTIONS"
          check "subscribe (preflight)"    "$BASE/subscribe" "OPTIONS"

          exit $fail

  lighthouse:
    name: Lighthouse (${{ matrix.form_factor }})
    needs: deploy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - form_factor: mobile
          - form_factor: desktop
            configPath: .github/lighthouse/desktop.json
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/lighthouse
        with:
          form_factor: ${{ matrix.form_factor }}
          configPath: ${{ matrix.configPath }}

  visual-regression:
    name: Visual Regression
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: lts/krypton
          cache: pnpm

      - name: Restore node_modules cache
        id: nm-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - run: pnpm install --frozen-lockfile
        if: steps.nm-cache.outputs.cache-hit != 'true'

      - name: Download built site
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - uses: ./.github/actions/visual-regression
