name: CI

on:
  push:
    branches: [preview, main]
  pull_request:
    branches: [preview, main]

jobs:
  quality:
    name: Format & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: lts/krypton
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check

      - run: pnpm lint

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: lts/krypton
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [quality, test]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: lts/krypton
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Fetch content
        run: pnpm build:content:fetch
        env:
          GITHUB_PAT: ${{ secrets.GH_PAT }}

      - run: pnpm assets:sync

      - run: pnpm build

      - run: pnpm build:search

      - name: Deploy to Netlify
        if: github.ref == 'refs/heads/main'
        run: pnpm --package=netlify-cli dlx netlify deploy --dir=dist --prod --build=false
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

  lighthouse:
    name: Lighthouse (${{ matrix.form_factor }})
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    strategy:
      matrix:
        include:
          - form_factor: mobile
          - form_factor: desktop
            configPath: .github/lighthouse/desktop.json
    steps:
      - uses: actions/checkout@v4

      - uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            https://sourcier.uk/
            https://sourcier.uk/blog/
          uploadArtifacts: true
          temporaryPublicStorage: true
          configPath: ${{ matrix.configPath }}
