name: Visual Regression

on:
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: Regenerate baselines instead of comparing
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  visual:
    name: Visual Regression (${{ inputs.update_snapshots && 'update' || 'compare' }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Pin to the same Playwright Docker image locally and in CI so font rendering is identical.
    # Image version must match the @playwright/test version in pnpm-lock.yaml.
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
      options: --ipc=host
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5

      # Node.js is provided by the Playwright container; setup-node is only used for pnpm caching.
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Fetch content
        run: pnpm build:content:fetch
        env:
          GITHUB_PAT: ${{ secrets.GH_PAT }}

      # rsync and jq are not included in the Playwright Docker image
      - run: apt-get update && apt-get install -y rsync jq
        shell: bash

      - run: pnpm assets:sync

      - run: pnpm build
        env:
          SHOW_DRAFTS: "false"
          PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          PUBLIC_POSTHOG_KEY: ${{ secrets.PUBLIC_POSTHOG_KEY }}
          PUBLIC_POSTHOG_HOST: ${{ secrets.PUBLIC_POSTHOG_HOST }}

      - run: pnpm build:search

      - uses: ./.github/actions/visual-regression
        with:
          update_snapshots: ${{ inputs.update_snapshots && 'true' || 'false' }}

      - name: Commit updated snapshots
        if: always() && inputs.update_snapshots
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/e2e/__snapshots__/
          if git diff --cached --quiet; then
            echo "No snapshot changes to commit."
            echo "## Snapshot Update" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "✅ All baselines are up to date — no changes." >> "$GITHUB_STEP_SUMMARY"
          else
            added=$(git diff --cached --name-only --diff-filter=A | wc -l | tr -d ' ')
            modified=$(git diff --cached --name-only --diff-filter=M | wc -l | tr -d ' ')
            deleted=$(git diff --cached --name-only --diff-filter=D | wc -l | tr -d ' ')
            total=$((added + modified + deleted))
            git commit -m "chore(visual): update snapshots [skip ci]"
            git push
            echo "## Snapshot Update" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "📸 **$total snapshot(s) updated** and committed." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "| ➕ Added | ✏️ Modified | 🗑️ Deleted | Total |" >> "$GITHUB_STEP_SUMMARY"
            echo "| --- | --- | --- | --- |" >> "$GITHUB_STEP_SUMMARY"
            echo "| $added | $modified | $deleted | $total |" >> "$GITHUB_STEP_SUMMARY"
          fi
