name: Visual Regression

on:
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: Regenerate baselines instead of comparing
        type: boolean
        default: false

jobs:
  visual:
    name: Visual Regression (${{ inputs.update_snapshots && 'update' || 'compare' }})
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5
        with:
          version: latest

      - uses: actions/setup-node@v6
        with:
          node-version: lts/krypton
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Fetch content
        run: pnpm build:content:fetch
        env:
          GITHUB_PAT: ${{ secrets.GH_PAT }}

      - run: pnpm assets:sync

      - run: pnpm build
        env:
          SHOW_DRAFTS: "false"
          PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          PUBLIC_POSTHOG_KEY: ${{ secrets.PUBLIC_POSTHOG_KEY }}
          PUBLIC_POSTHOG_HOST: ${{ secrets.PUBLIC_POSTHOG_HOST }}

      - run: pnpm build:search

      - uses: ./.github/actions/visual-regression
        with:
          update_snapshots: ${{ inputs.update_snapshots && 'true' || 'false' }}

      - name: Commit updated snapshots
        if: inputs.update_snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/e2e/__snapshots__/
          if git diff --cached --quiet; then
            echo "No snapshot changes to commit."
            echo "## Snapshot Update" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "✅ All baselines are up to date — no changes." >> "$GITHUB_STEP_SUMMARY"
          else
            added=$(git diff --cached --name-only --diff-filter=A | wc -l | tr -d ' ')
            modified=$(git diff --cached --name-only --diff-filter=M | wc -l | tr -d ' ')
            deleted=$(git diff --cached --name-only --diff-filter=D | wc -l | tr -d ' ')
            total=$((added + modified + deleted))
            git commit -m "chore(visual): update snapshots [skip ci]"
            git push
            echo "## Snapshot Update" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "📸 **$total snapshot(s) updated** and committed." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "| ➕ Added | ✏️ Modified | 🗑️ Deleted | Total |" >> "$GITHUB_STEP_SUMMARY"
            echo "| --- | --- | --- | --- |" >> "$GITHUB_STEP_SUMMARY"
            echo "| $added | $modified | $deleted | $total |" >> "$GITHUB_STEP_SUMMARY"
          fi
