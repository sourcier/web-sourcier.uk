name: Run Lighthouse
description: Run Lighthouse CI for mobile and desktop

inputs:
  form_factor:
    description: Form factor (mobile or desktop)
    required: true
  configPath:
    description: Path to a Lighthouse config file
    required: false
  base_url:
    description: Base URL to audit — home page and /blog/ are checked
    required: true
  preview_passcode:
    description: Passcode for the preview deploy's auth wall; when set, a matching cookie bypasses it
    required: false
    default: ""
  environment:
    description: Label distinguishing this run (e.g. prod, preview) — keeps uploaded artifact names unique per workflow run
    required: true

runs:
  using: composite
  steps:
    # Passcode-gated preview needs a valid preview_auth cookie or Lighthouse just audits the login wall.
    - name: Compute preview auth cookie
      id: preview_auth
      if: ${{ inputs.preview_passcode != '' }}
      shell: bash
      run: |
        TOKEN=$(node -e "process.stdout.write(require('crypto').createHmac('sha256', process.env.PASSCODE).update('preview_authenticated').digest('base64'))")
        echo "cookie=preview_auth=$TOKEN" >> "$GITHUB_OUTPUT"
      env:
        PASSCODE: ${{ inputs.preview_passcode }}

    # Only build a merged config when a cookie is needed — keeps the production
    # lighthouse run byte-identical to before (still uses configPath directly).
    - name: Build Lighthouse config with auth cookie
      id: config
      if: ${{ inputs.preview_passcode != '' }}
      shell: bash
      run: |
        BASE='{"ci":{"collect":{"settings":{}}}}'
        if [ -n "${{ inputs.configPath }}" ]; then
          BASE=$(cat "${{ inputs.configPath }}")
        fi
        echo "$BASE" | jq --arg cookie "${{ steps.preview_auth.outputs.cookie }}" '.ci.collect.settings.extraHeaders = {"Cookie": $cookie}' > /tmp/lighthouserc.json
        echo "path=/tmp/lighthouserc.json" >> "$GITHUB_OUTPUT"

    - uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12
      with:
        urls: |
          ${{ inputs.base_url }}/
          ${{ inputs.base_url }}/blog/
        uploadArtifacts: true
        artifactName: lighthouse-results-${{ inputs.environment }}-${{ inputs.form_factor }}
        temporaryPublicStorage: true
        configPath: ${{ inputs.preview_passcode != '' && steps.config.outputs.path || inputs.configPath }}

    - name: Print Lighthouse scores
      shell: bash
      run: |
        badge() { local s=$1; if [ "$s" -ge 90 ]; then echo "🟢 $s"; elif [ "$s" -ge 50 ]; then echo "🟡 $s"; else echo "🔴 $s"; fi; }

        form_factor="${{ inputs.form_factor }}"
        echo "## Lighthouse — ${form_factor^}" >> "$GITHUB_STEP_SUMMARY"
        echo "" >> "$GITHUB_STEP_SUMMARY"
        echo "| URL | Performance | Accessibility | Best Practices | SEO |" >> "$GITHUB_STEP_SUMMARY"
        echo "| --- | --- | --- | --- | --- |" >> "$GITHUB_STEP_SUMMARY"

        find .lighthouseci -name 'lhr-*.json' | while read f; do
          url=$(jq -r '.finalUrl' "$f")
          perf=$(jq '.categories.performance.score * 100 | round' "$f")
          a11y=$(jq '.categories.accessibility.score * 100 | round' "$f")
          bp=$(jq '.categories["best-practices"].score * 100 | round' "$f")
          seo=$(jq '.categories.seo.score * 100 | round' "$f")

          echo "| $url | $(badge $perf) | $(badge $a11y) | $(badge $bp) | $(badge $seo) |" >> "$GITHUB_STEP_SUMMARY"

          echo "--- $url ---"
          echo "  Performance:    $perf"
          echo "  Accessibility:  $a11y"
          echo "  Best Practices: $bp"
          echo "  SEO:            $seo"
        done
