name: Run Visual Regression
description: Install Playwright, serve the built site, and run visual regression tests

inputs:
  update_snapshots:
    description: Regenerate baselines instead of comparing
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Install Playwright browsers
      shell: bash
      run: pnpm exec playwright install chromium webkit --with-deps

    - name: Serve site
      shell: bash
      run: pnpm --package=serve dlx serve dist -p 8888 &

    - name: Wait for server
      shell: bash
      run: until curl -sf http://localhost:8888 > /dev/null; do sleep 1; done

    - name: Run visual regression tests
      shell: bash
      run: ${{ inputs.update_snapshots == 'true' && 'pnpm test:visual:update' || 'pnpm test:visual' }}

    - name: Upload diff report
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: visual-regression-report
        path: playwright-report/
        retention-days: 7

    - name: Upload updated snapshots
      if: inputs.update_snapshots == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: updated-snapshots
        path: src/e2e/__snapshots__/
        retention-days: 7
