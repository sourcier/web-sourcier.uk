name: Run Visual Regression
description: Install Playwright, serve the built site, and run visual regression tests

inputs:
  update_snapshots:
    description: Regenerate baselines instead of comparing
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Cache Playwright browsers
      id: pw-cache
      # Skip when running inside the Playwright Docker container — browsers are
      # pre-installed at /ms-playwright and PLAYWRIGHT_BROWSERS_PATH is already set.
      if: ${{ env.PLAYWRIGHT_BROWSERS_PATH != '/ms-playwright' }}
      uses: actions/cache@v5
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

    - name: Install Playwright browsers
      if: ${{ env.PLAYWRIGHT_BROWSERS_PATH != '/ms-playwright' && steps.pw-cache.outputs.cache-hit != 'true' }}
      shell: bash
      run: pnpm exec playwright install chromium webkit --with-deps

    - name: Serve site
      shell: bash
      run: pnpm --package=serve dlx serve dist -p 9000 &

    - name: Wait for server
      shell: bash
      run: until curl -sf http://localhost:9000 > /dev/null; do sleep 1; done

    - name: Run visual regression tests
      shell: bash
      run: |
        if [ "${{ inputs.update_snapshots }}" = "true" ]; then
          # Playwright exits with code 1 when snapshots are written/updated (by design).
          # We treat that as success here; the commit step reviews the actual diff.
          pnpm test:visual:update || true
        else
          # Skip comparison if no linux baselines exist yet
          BASELINE_COUNT=$(find src/e2e/__snapshots__ -name "*-linux.png" 2>/dev/null | wc -l | tr -d ' ')
          if [ "$BASELINE_COUNT" = "0" ]; then
            echo "No baselines found — run the Visual Regression workflow with update_snapshots=true to generate them."
            exit 0
          fi
          pnpm test:visual
        fi

    - name: Write job summary
      if: always()
      shell: bash
      run: |
        echo "## Visual Regression" >> "$GITHUB_STEP_SUMMARY"
        echo "" >> "$GITHUB_STEP_SUMMARY"

        if [ ! -f test-results.json ]; then
          echo "⏭️ No baselines found — tests skipped." >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi

        passed=$(jq '.stats.expected' test-results.json)
        failed=$(jq '.stats.unexpected' test-results.json)
        skipped=$(jq '.stats.skipped' test-results.json)
        flaky=$(jq '.stats.flaky' test-results.json)
        total=$((passed + failed + skipped + flaky))

        if [ "$failed" -eq 0 ]; then
          echo "🟢 All tests passed" >> "$GITHUB_STEP_SUMMARY"
        else
          echo "🔴 $failed test(s) failed" >> "$GITHUB_STEP_SUMMARY"
        fi

        echo "" >> "$GITHUB_STEP_SUMMARY"
        echo "| ✅ Passed | ❌ Failed | ⏭️ Skipped | 🔄 Flaky | Total |" >> "$GITHUB_STEP_SUMMARY"
        echo "| --- | --- | --- | --- | --- |" >> "$GITHUB_STEP_SUMMARY"
        echo "| $passed | $failed | $skipped | $flaky | $total |" >> "$GITHUB_STEP_SUMMARY"

        if [ "$failed" -gt 0 ]; then
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Failed Tests" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          jq -r '[.. | objects | select(has("specs")) | .specs[] | . as $spec | .tests[] | select(.status == "unexpected") | "- **\(.projectName)** — \($spec.title)"] | unique[]' test-results.json >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: Upload diff report
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: visual-regression-report
        path: reports/playwright/
        retention-days: 7
