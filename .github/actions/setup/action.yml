name: Setup Node & pnpm
description: >
  Install pnpm, configure Node.js with pnpm cache, restore the node_modules
  cache, and install dependencies if the cache missed.

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v5
      with:
        version: latest

    - uses: actions/setup-node@v6
      with:
        node-version: lts/krypton
        cache: pnpm

    - name: Restore node_modules cache
      id: nm-cache
      uses: actions/cache@v5
      with:
        path: node_modules
        key: nm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

    - run: pnpm install --frozen-lockfile
      if: steps.nm-cache.outputs.cache-hit != 'true'
      shell: bash
